<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Berhasil Diproses - SmartLeaf Vision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Membuat konten otomatis berada di tengah layar secara vertikal */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border-top: 6px solid #2e7d32;
            max-width: 500px;
            width: 100%;
        }
        .icon-success {
            font-size: 5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .btn-custom {
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            background: linear-gradient(135deg, #1b5e20 0%, #43a047 100%);
            border: none;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(27, 94, 32, 0.3);
            background: linear-gradient(135deg, #144d18 0%, #388e3c 100%);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="success-card mx-auto">
        
        <div class="icon-success">✅</div>
        
        <h2 class="fw-bold text-success mb-3">Proses Selesai!</h2>
        
        <p class="text-muted mb-4">
            Seluruh dataset citra daun Kaggle telah berhasil diekstraksi menggunakan metode segmentasi warna HSV dan tersimpan di dalam database.
        </p>

        <div class="alert alert-light border border-success border-opacity-25 mb-4">
            <h6 class="mb-1 text-muted">Total Data Terproses:</h6>
            <h2 class="text-success fw-bold mb-0">{{ total_data }} <span class="fs-6 fw-normal text-muted">Citra</span></h2>
        </div>

        <a href="/dashboard/" class="btn btn-success btn-custom w-100 text-white shadow-sm">
            📊 Lihat Dashboard Hasil
        </a>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
